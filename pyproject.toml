[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift-modeling"
version = "1.0.0"
description = "Uplift modeling and incremental impact simulator with causal validation, policy simulation and drift monitoring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
# Each of these is detected at runtime and skipped with a printed note when
# absent, so a failure here never blocks training or serving.
extras = ["econml>=0.15", "mlflow>=2.10", "evidently>=0.4"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
